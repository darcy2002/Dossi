# Keeps the Render free-tier backend warm by pinging /health every 10 minutes.
# Render spins a free service down after ~15 min of inactivity; the first request
# after that pays a cold-start delay. This avoids it during a demo window.
#
# Setup: add a repo secret BACKEND_URL = https://dossi-backend.onrender.com
# (Settings > Secrets and variables > Actions). Without it, the job no-ops.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay a few minutes)
  workflow_dispatch: {}        # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "BACKEND_URL secret not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 30 "${{ secrets.BACKEND_URL }}/health" && echo "ok"
